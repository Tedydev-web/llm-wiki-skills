name: "Test Pre-Merge (L5 Real LLM — gated)"

# Triggers only when 'pre-merge' label is added to a PR.
# Cost caps (validated 2026-05-05): $0.50/PR + $20/month aggregate.
# L5 only runs when SKILL.md files changed in the PR diff.

on:
  pull_request:
    types: [labeled]
  # workflow_dispatch allows repo-admin emergency override when monthly $20 cap is hit.
  # Validation: 2026-05-05. See test-l5-override job below.
  workflow_dispatch:

jobs:
  test-l5-llm:
    name: "L5 Real LLM (pre-merge gated)"
    if: contains(github.event.pull_request.labels.*.name, 'pre-merge')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get install -y jq bc
          jq --version

      - name: Check monthly spend cap ($20 aggregate)
        id: monthly-cap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Read rolling 30-day spend from repo variable L5_MONTHLY_USD
          spend="${{ vars.L5_MONTHLY_USD }}"
          if [ -z "$spend" ]; then spend="0"; fi
          echo "Current monthly L5 spend: \$$spend"

          if echo "$spend >= 20" | bc -l | grep -q '^1$'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Monthly \$20 cap reached (current: \$$spend)"
            gh pr comment "${{ github.event.pull_request.number }}" \
              --body "**L5 skipped:** monthly \$20 cap hit (current spend: \$$spend). Manual override via \`workflow_dispatch\` after next month boundary." \
              2>/dev/null || true
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Cap not reached — proceeding with L5 (spend: \$$spend / \$20)"
          fi

      - name: Check SKILL.md changes in PR
        id: skill-changed
        if: steps.monthly-cap.outputs.skip == 'false'
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "$base"..."$head" | grep -q 'SKILL\.md'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "SKILL.md changed — L5 will run"
            git diff --name-only "$base"..."$head" | grep 'SKILL\.md'
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No SKILL.md changes in this PR — L5 skipped"
          fi

      - name: Run L5 real-LLM tests (capped at $0.50/PR)
        if: |
          steps.monthly-cap.outputs.skip == 'false' &&
          steps.skill-changed.outputs.changed == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "WARNING: ANTHROPIC_API_KEY not set — L5 skipped (not a failure)"
            exit 0
          fi
          bash tests/run-real-llm-gated.sh

      - name: Update monthly spend counter
        if: |
          always() &&
          steps.monthly-cap.outputs.skip == 'false' &&
          steps.skill-changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash tests/update-monthly-spend.sh || echo "WARNING: spend update failed (non-fatal)"

      - name: Upload L5 golden snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l5-golden-snapshots
          path: tests/golden/**/*.llm-golden.txt
          if-no-files-found: ignore
          retention-days: 30

  # Manual override when monthly cap is hit (repo admin only)
  test-l5-override:
    name: "L5 Manual Override (admin)"
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install -y jq bc

      - name: Run L5 with override
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          L5_CAP_OVERRIDE: "1"
        run: |
          echo "WARNING: Running L5 with manual cap override — ensure this is intentional"
          bash tests/run-real-llm-gated.sh
