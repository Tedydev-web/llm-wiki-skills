name: "wiki-team — unit + integration tests"

on:
  pull_request:
    paths:
      - "apps/wiki-team/**"
      - "packages/wiki-{schema,mcp,pdf-extract,shared}/**"
      - "tests/wiki-team/**"
      - "vitest.config.ts"
      - "vitest.integration.config.ts"
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"

concurrency:
  group: wiki-team-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: "Unit tests (no DB)"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun modules
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun run test:wiki-team:unit
        env:
          SKIP_DB_TESTS: "1"
          NODE_ENV: test

      - name: Run unit tests with coverage
        run: bun run test:wiki-team:coverage
        env:
          SKIP_DB_TESTS: "1"
          NODE_ENV: test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-unit
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  integration:
    name: "Integration tests (Postgres + Redis + MinIO)"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wiki_test
          POSTGRES_PASSWORD: wiki_test_pass
          POSTGRES_DB: wiki_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379

      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun modules
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run DB migrations
        run: bun run db:migrate
        env:
          DATABASE_URL: postgresql://wiki_test:wiki_test_pass@localhost:5432/wiki_test

      - name: Run integration tests
        run: bun run test:wiki-team:integration
        env:
          INTEGRATION_TEST: "1"
          SKIP_DB_TESTS: "0"
          TEST_DATABASE_URL: postgresql://wiki_test:wiki_test_pass@localhost:5432/wiki_test
          TEST_REDIS_URL: redis://localhost:6379
          TEST_MINIO_ENDPOINT: http://localhost:9000
          TEST_MINIO_ACCESS_KEY: minioadmin
          TEST_MINIO_SECRET_KEY: minioadmin
          NODE_ENV: test
          # LLM is mocked — no real API calls in CI
          ANTHROPIC_API_KEY: "mock-key-ci-no-real-calls"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7
